<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 凱悅聚樂部 ❤️ 營運管理系統</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --milk:#F5EFE6;--milk2:#EDE0D4;--milk3:#E3D5C8;
  --brown1:#8B6F5E;--brown2:#6B4F40;--brown3:#4A3728;
  --gold:#C9A96E;--gold2:#A8834E;
  --text1:#3A2E28;--text2:#6B5A52;--text3:#9C8880;
  --green:#5A8A6A;--red:#A05050;--orange:#C0784A;
  --white:#FDFAF7;--radius:12px;--radius-sm:8px;
}
body{background:var(--milk);font-family:'Georgia',serif;color:var(--text1);min-height:100vh}
.app{display:flex;flex-direction:column;min-height:100vh}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--milk);padding:20px}
.login-box{background:var(--white);border-radius:var(--radius);padding:36px 32px;width:100%;max-width:380px;border:1px solid var(--milk3);text-align:center;box-shadow:0 4px 24px rgba(74,55,40,0.08)}
.login-logo{font-size:40px;margin-bottom:6px}
.login-title{font-size:22px;color:var(--brown3);letter-spacing:3px;margin-bottom:4px}
.login-sub{font-size:11px;color:var(--text3);letter-spacing:2px;margin-bottom:28px}
.login-tabs{display:flex;gap:8px;margin-bottom:22px}
.login-tab{flex:1;background:var(--milk2);border:1px solid var(--milk3);color:var(--text2);padding:8px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s}
.login-tab.active{background:var(--brown2);color:var(--milk);border-color:var(--brown2)}
.login-form-group{margin-bottom:14px;text-align:left}
.login-form-group label{font-size:11px;color:var(--text2);display:block;margin-bottom:5px;letter-spacing:.5px}
.login-form-group input{background:var(--milk);border:1px solid var(--milk3);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;color:var(--text1);font-family:inherit;width:100%;outline:none;transition:border-color .2s}
.login-form-group input:focus{border-color:var(--gold2)}
.login-btn{width:100%;background:var(--brown2);color:var(--milk);border:none;padding:11px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;font-family:inherit;margin-top:6px;transition:background .2s;letter-spacing:1px}
.login-btn:hover{background:var(--brown3)}
.login-msg{font-size:12px;margin-top:12px;min-height:20px}
.login-msg.ok{color:var(--green)}
.login-msg.err{color:var(--red)}

/* HEADER */
.header{background:var(--brown3);color:var(--gold);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header-title{font-size:18px;letter-spacing:2px;font-weight:normal}
.header-sub{font-size:10px;color:var(--milk3);letter-spacing:2px;margin-top:2px}
.header-user{font-size:11px;color:var(--milk3);display:flex;align-items:center;gap:10px}
.logout-btn{background:none;border:1px solid var(--milk3);color:var(--milk3);padding:4px 12px;border-radius:20px;font-size:10px;cursor:pointer;font-family:inherit;transition:all .2s}
.logout-btn:hover{border-color:var(--gold);color:var(--gold)}

/* NAV */
.nav{background:var(--brown2);display:flex;overflow-x:auto;padding:0 8px;gap:2px}
.nav-btn{background:none;border:none;color:var(--milk3);padding:10px 12px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;border-bottom:2px solid transparent;transition:all .2s}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.nav-btn:hover{color:var(--milk)}

.content{flex:1;padding:16px;max-width:960px;margin:0 auto;width:100%}
.card{background:var(--white);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid var(--milk3)}
.card-title{font-size:12px;color:var(--text2);letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:14px;background:var(--gold);border-radius:2px;display:inline-block}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:var(--milk2);border-radius:var(--radius-sm);padding:12px;text-align:center;border:1px solid var(--milk3)}
.stat-label{font-size:10px;color:var(--text3);margin-bottom:4px;letter-spacing:.5px}
.stat-value{font-size:20px;color:var(--brown3);font-weight:bold}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-sub{font-size:10px;color:var(--text3);margin-top:2px}
input,select,textarea{background:var(--milk);border:1px solid var(--milk3);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;color:var(--text1);font-family:inherit;width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--gold2)}
label{font-size:11px;color:var(--text2);display:block;margin-bottom:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.form-group{margin-bottom:10px}
.btn{background:var(--brown2);color:var(--milk);border:none;padding:9px 18px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:inherit;transition:background .2s}
.btn:hover{background:var(--brown3)}
.btn-sm{padding:5px 12px;font-size:11px}
.btn-outline{background:none;border:1px solid var(--brown2);color:var(--brown2)}
.btn-outline:hover{background:var(--milk2)}
.btn-danger{background:var(--red)}
.btn-danger:hover{background:#8a3a3a}
.btn-gold{background:var(--gold2)}
.btn-gold:hover{background:#8a6a38}
.btn-green{background:var(--green)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--milk2);color:var(--text2);padding:8px 10px;text-align:left;font-weight:normal;font-size:11px;letter-spacing:.5px}
td{padding:8px 10px;border-bottom:1px solid var(--milk2);color:var(--text1)}
tr:last-child td{border-bottom:none}
.tfoot td{background:var(--milk2);font-weight:bold;color:var(--brown3)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px}
.badge-green{background:#D4EAD4;color:var(--green)}
.badge-red{background:#EAD4D4;color:var(--red)}
.badge-orange{background:#EAE0D4;color:var(--orange)}
.badge-gold{background:#EAE0C8;color:var(--gold2)}
.month-selector{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.month-selector select{width:auto;min-width:75px}
.divider{border:none;border-top:1px solid var(--milk3);margin:14px 0}
.progress-bar{background:var(--milk2);border-radius:4px;height:8px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:4px;transition:width .4s ease}
.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:10px}
.alert-green{background:#D4EAD4;color:var(--green);border-left:3px solid var(--green)}
.alert-orange{background:#F0E4D0;color:var(--orange);border-left:3px solid var(--orange)}
.alert-red{background:#EAD4D4;color:var(--red);border-left:3px solid var(--red)}
.hidden{display:none}
.text-right{text-align:right}
.text-center{text-align:center}
.bold{font-weight:bold}
.text-gold{color:var(--gold2)}
.text-green{color:var(--green)}
.text-red{color:var(--red)}
.mt8{margin-top:8px}
.mb8{margin-bottom:8px}
.flex{display:flex;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.gap8{gap:8px}
.small{font-size:10px;color:var(--text3)}
.section-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.section-tab{background:var(--milk2);border:1px solid var(--milk3);color:var(--text2);padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s}
.section-tab.active{background:var(--brown2);color:var(--milk);border-color:var(--brown2)}
.list-item{background:var(--milk);border:1px solid var(--milk3);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.month-cell{background:var(--milk);border:1px solid var(--milk3);border-radius:var(--radius-sm);padding:10px;cursor:pointer;transition:all .2s}
.month-cell:hover{border-color:var(--gold2);background:var(--milk2)}
.month-cell.has-data{border-left:3px solid var(--gold2)}
.month-cell-name{font-size:10px;color:var(--text2);margin-bottom:4px}
.month-cell-value{font-size:14px;color:var(--brown3);font-weight:bold}
.growth-up{color:var(--green);font-size:10px}
.growth-down{color:var(--red);font-size:10px}
.cloud-indicator{font-size:10px;padding:2px 10px;border-radius:20px;background:var(--milk2);color:var(--text3);transition:all .3s}
.cloud-indicator.saved{background:#D4EAD4;color:var(--green)}
.cloud-indicator.saving{background:#EAE0C8;color:var(--gold2)}
.cloud-indicator.error{background:#EAD4D4;color:var(--red)}

@media(max-width:600px){
  .form-row,.form-row-3{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
  .month-grid{grid-template-columns:repeat(3,1fr)}
  .header-title{font-size:15px}
}

</style>
</head>
